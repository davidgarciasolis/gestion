<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pedidos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="login-container" id="login-container">
        <div class="glass-panel login-panel">
            <h2>Iniciar Sesión</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%">Entrar</button>
                <div id="login-error" style="color: var(--danger); margin-top: 1rem; text-align: center;"></div>
            </form>
        </div>
    </div>

    <div class="app-container" id="app-container" style="display: none;">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" style="display: flex; flex-direction: column;">
            <div class="sidebar-header">
                <h2>Gestión Pro</h2>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-btn active" data-view="clientes">Clientes</button>
                <button class="nav-btn" data-view="pedidos">Pedidos</button>
            </nav>
            <div style="margin-top: auto; padding: 1rem;">
                <button class="btn-danger" id="btn-logout" style="width: 100%;">Cerrar Sesión</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <h1 id="view-title">Clientes</h1>
                <button class="btn-primary" id="btn-create">Nuevo Registro</button>
            </header>

            <div class="content-body" id="app-content">
                <!-- Dynamic Content goes here (Tables) -->
            </div>
        </main>
    </div>

    <!-- Modal for Forms -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content glass-panel" id="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Formulario</h3>
                <button class="btn-close" id="btn-close-modal">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Dynamic Form goes here -->
            </div>
        </div>
    </div>

    <script src="app.js?v=2"></script>
</body>
</html>
